name: Android Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Install Flutter packages
        working-directory: ./flutter_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./flutter_app
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build Android Release App Bundle (AAB)
        working-directory: ./flutter_app
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: bloomtrack-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Release AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: bloomtrack-release-aab
          path: flutter_app/build/app/outputs/bundle/release/app-release.aab
